<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Headshot photography by London Oliver. Available for creative commissions.">
    <meta name="theme-color" content="#ffffff">
    <title>Headshots | London Oliver Photography</title>
    <link rel="stylesheet" href="../portfolio.css">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="../" aria-label="London Oliver photography home">London Oliver <span>/ Photography</span></a>
        <nav class="site-nav" aria-label="Photography navigation">
            <details class="portfolio-menu">
                <summary>Portfolio</summary>
                <div class="portfolio-dropdown">
                    <a href="./" aria-current="page">Headshots</a>
                    <a href="../fashion/">Fashion</a>
                    <a href="../street/">Street</a>
                    <a href="../events/">Events</a>
                </div>
            </details>
            <a class="nav-cta" href="../contact/">Contact</a>
        </nav>
    </header>
    <main>
        <header class="page-heading">
            <h1>Headshots</h1>
        </header>
        <section class="gallery" aria-label="Headshot photography">
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/portrait-studio.jpg" data-alt="Portrait leaning against a textured stone wall"><img src="../images/portrait-studio.jpg" alt="Portrait leaning against a textured stone wall" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/studio-portrait.jpg" data-alt="Studio portrait against a bright backdrop"><img src="../images/studio-portrait.jpg" alt="Studio portrait against a bright backdrop" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/white-suit-portrait.jpg" data-alt="Portrait in a white blazer against sculptural architecture"><img src="../images/white-suit-portrait.jpg" alt="Portrait in a white blazer against sculptural architecture" loading="lazy"></button></figure>
        </section>
    </main>
    <footer class="site-footer"><span>Copyright 2026 by London Oliver. ALL RIGHTS RESERVED.</span><nav class="footer-links" aria-label="Social links"><a href="https://www.instagram.com/londonoliverphotography" target="_blank" rel="noopener noreferrer">@londonoliverphotography</a></nav></footer>
    <dialog id="lightbox" aria-label="Expanded photograph"><button class="lightbox-close" type="button" aria-label="Close photograph">&times;</button><img id="lightbox-image" src="" alt=""></dialog>
    <script src="../menu.js" defer></script>
    <script src="../lightbox.js" defer></script>
</body>
</html>
