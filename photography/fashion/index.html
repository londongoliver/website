<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fashion photography by London Oliver. Available for creative commissions.">
    <meta name="theme-color" content="#ffffff">
    <title>Fashion | London Oliver Photography</title>
    <link rel="stylesheet" href="../portfolio.css">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="../" aria-label="London Oliver photography home">London Oliver <span>/ Photography</span></a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="photography-nav" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="photography-nav" aria-label="Photography navigation">
            <details class="portfolio-menu">
                <summary>Portfolio</summary>
                <div class="portfolio-dropdown">
                    <a href="../portrait/">Headshots</a>
                    <a href="./" aria-current="page">Fashion</a>
                    <a href="../street/">Street</a>
                    <a href="../events/">Events</a>
                </div>
            </details>
            <a class="nav-cta" href="../contact/">Contact</a>
        </nav>
    </header>
    <main>
        <header class="page-heading">
            <h1>Fashion</h1>
        </header>
        <section class="gallery" aria-label="Fashion photography">
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/denim-editorial.jpg" data-alt="Fashion portrait in a denim jacket against a graphic wall"><img src="../images/denim-editorial.jpg" alt="Fashion portrait in a denim jacket against a graphic wall" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/denim-in-the-city.jpg" data-alt="Close-up fashion portrait in denim surrounded by city greenery"><img src="../images/denim-in-the-city.jpg" alt="Close-up fashion portrait in denim surrounded by city greenery" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/pink-dress-editorial.jpg" data-alt="Model in a flowing bright pink dress in an urban setting"><img src="../images/pink-dress-editorial.jpg" alt="Model in a flowing bright pink dress in an urban setting" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/black-dress-editorial.jpg" data-alt="Fashion portrait in a black dress and white boots"><img src="../images/black-dress-editorial.jpg" alt="Fashion portrait in a black dress and white boots" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/metallic-fashion.jpg" data-alt="Fashion portrait in a reflective metallic dress"><img src="../images/metallic-fashion.jpg" alt="Fashion portrait in a reflective metallic dress" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/fashion-reflection.jpg" data-alt="Fashion portrait beside a mirrored wall"><img src="../images/fashion-reflection.jpg" alt="Fashion portrait beside a mirrored wall" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/wings-editorial-silver.jpg" data-alt="Fashion portrait in a shimmering silver look"><img src="../images/wings-editorial-silver.jpg" alt="Fashion portrait in a shimmering silver look" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/wings-editorial-pink.jpg" data-alt="Pink-lit fashion portrait with feathered styling"><img src="../images/wings-editorial-pink.jpg" alt="Pink-lit fashion portrait with feathered styling" loading="lazy"></button></figure>
        </section>
    </main>
    <footer class="site-footer"><span>Copyright 2026 by London Oliver. ALL RIGHTS RESERVED.</span><nav class="footer-links" aria-label="Social links"><a class="instagram-link" href="https://www.instagram.com/londonoliverphotography" target="_blank" rel="noopener noreferrer" aria-label="Instagram: @londonoliverphotography"><svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle class="instagram-icon-dot" cx="18" cy="6" r="1"></circle></svg></a></nav></footer>
    <dialog id="lightbox" aria-label="Expanded photograph"><button class="lightbox-close" type="button" aria-label="Close photograph">&times;</button><img id="lightbox-image" src="" alt=""></dialog>
    <script src="../menu.js" defer></script>
    <script src="../lightbox.js" defer></script>
</body>
</html>
