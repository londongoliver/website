<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Street photography by London Oliver. Available for creative commissions.">
    <meta name="theme-color" content="#ffffff">
    <title>Street | London Oliver Photography</title>
    <link rel="stylesheet" href="../portfolio.css">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="../" aria-label="London Oliver photography home">London Oliver <span>/ Photography</span></a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="photography-nav" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="photography-nav" aria-label="Photography navigation">
            <details class="portfolio-menu">
                <summary>Portfolio</summary>
                <div class="portfolio-dropdown">
                    <a href="../portrait/">Headshots</a>
                    <a href="../fashion/">Fashion</a>
                    <a href="./" aria-current="page">Street</a>
                    <a href="../events/">Events</a>
                </div>
            </details>
            <a class="nav-cta" href="../contact/">Contact</a>
        </nav>
    </header>
    <main>
        <header class="page-heading">
            <h1>Street</h1>
        </header>
        <section class="gallery" aria-label="Street photography">
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/graffiti-portrait.jpg" data-alt="Street portrait against a colorful graffiti-covered wall"><img src="../images/graffiti-portrait.jpg" alt="Street portrait against a colorful graffiti-covered wall" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-wrong-way.jpg" data-alt="Wrong way sign above a dark parking garage entrance"><img src="../images/street-wrong-way.jpg" alt="Wrong way sign above a dark parking garage entrance" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-stairwell.jpg" data-alt="Shadowed downtown stairwell and sidewalk"><img src="../images/street-stairwell.jpg" alt="Shadowed downtown stairwell and sidewalk" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-dumpsters.jpg" data-alt="Sepia-toned alley dumpsters covered in graffiti"><img src="../images/street-dumpsters.jpg" alt="Sepia-toned alley dumpsters covered in graffiti" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-alley.jpg" data-alt="Warm-toned downtown alley framed by city buildings"><img src="../images/street-alley.jpg" alt="Warm-toned downtown alley framed by city buildings" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-building.jpg" data-alt="Sepia-toned downtown building facade"><img src="../images/street-building.jpg" alt="Sepia-toned downtown building facade" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-flower-st.jpg" data-alt="Black and white view down Flower Street in downtown Los Angeles"><img src="../images/street-flower-st.jpg" alt="Black and white view down Flower Street in downtown Los Angeles" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-downtown.jpg" data-alt="Sunlight cutting through a downtown Los Angeles street"><img src="../images/street-downtown.jpg" alt="Sunlight cutting through a downtown Los Angeles street" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-parking-garage.jpg" data-alt="Wrong way sign over a dark parking garage entrance"><img src="../images/street-parking-garage.jpg" alt="Wrong way sign over a dark parking garage entrance" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-tunnel.jpg" data-alt="Long concrete tunnel with a bright opening at the end"><img src="../images/street-tunnel.jpg" alt="Long concrete tunnel with a bright opening at the end" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-church-ornament.jpg" data-alt="Intricate stone facade and arched church doorway"><img src="../images/street-church-ornament.jpg" alt="Intricate stone facade and arched church doorway" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-subway.jpg" data-alt="Subway train interior with polished chrome poles and seats"><img src="../images/street-subway.jpg" alt="Subway train interior with polished chrome poles and seats" loading="lazy"></button></figure>
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/street-road-sign.jpg" data-alt="Bright green road sign reading South, with layered graffiti and a California highway marker"><img src="../images/street-road-sign.jpg" alt="Bright green road sign reading South, with layered graffiti and a California highway marker" loading="lazy"></button></figure>
        </section>
    </main>
    <footer class="site-footer"><span>Copyright 2026 by London Oliver. ALL RIGHTS RESERVED.</span><nav class="footer-links" aria-label="Social links"><a class="instagram-link" href="https://www.instagram.com/londonoliverphotography" target="_blank" rel="noopener noreferrer" aria-label="Instagram: @londonoliverphotography"><svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle class="instagram-icon-dot" cx="18" cy="6" r="1"></circle></svg></a></nav></footer>
    <dialog id="lightbox" aria-label="Expanded photograph"><button class="lightbox-close" type="button" aria-label="Close photograph">&times;</button><img id="lightbox-image" src="" alt=""></dialog>
    <script src="../menu.js" defer></script>
    <script src="../lightbox.js" defer></script>
</body>
</html>
