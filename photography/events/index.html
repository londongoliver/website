<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Event photography by London Oliver. Available for creative commissions.">
    <meta name="theme-color" content="#ffffff">
    <title>Events | London Oliver Photography</title>
    <link rel="stylesheet" href="../portfolio.css">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="../" aria-label="London Oliver photography home">London Oliver <span>/ Photography</span></a>
        <nav class="site-nav" aria-label="Photography navigation">
            <details class="portfolio-menu">
                <summary>Portfolio</summary>
                <div class="portfolio-dropdown">
                    <a href="../portrait/">Headshots</a>
                    <a href="../fashion/">Fashion</a>
                    <a href="../street/">Street</a>
                    <a href="./" aria-current="page">Events</a>
                </div>
            </details>
            <a class="nav-cta" href="../contact/">Contact</a>
        </nav>
    </header>
    <main>
        <header class="page-heading">
            <h1>Events</h1>
        </header>
        <section class="gallery gallery-single" aria-label="Event photography">
            <figure class="photo"><button class="photo-button" type="button" data-image="../images/film-event-portrait.jpg" data-alt="Portrait at a film premiere"><img src="../images/film-event-portrait.jpg" alt="Portrait at a film premiere" loading="lazy"></button></figure>
        </section>
    </main>
    <footer class="site-footer"><span>Copyright 2026 by London Oliver. ALL RIGHTS RESERVED.</span><nav class="footer-links" aria-label="Social links"><a href="https://www.instagram.com/londonoliverphotography" target="_blank" rel="noopener noreferrer">@londonoliverphotography</a></nav></footer>
    <dialog id="lightbox" aria-label="Expanded photograph"><button class="lightbox-close" type="button" aria-label="Close photograph">&times;</button><img id="lightbox-image" src="" alt=""></dialog>
    <script src="../menu.js" defer></script>
    <script src="../lightbox.js" defer></script>
</body>
</html>
