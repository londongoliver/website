<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Headshot, fashion, street, and event photography by London Oliver. Available for creative commissions.">
    <meta name="theme-color" content="#ffffff">
    <title>Photography | London Oliver</title>
    <link rel="stylesheet" href="portfolio.css">
</head>
<body class="landing-page">
    <header class="site-header landing-header">
        <a class="wordmark" href="./" aria-label="London Oliver photography home">London Oliver <span>/ Photography</span></a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="photography-nav" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="photography-nav" aria-label="Photography categories">
            <details class="portfolio-menu">
                <summary>Portfolio</summary>
                <div class="portfolio-dropdown">
                    <a href="portrait/">Headshots</a>
                    <a href="fashion/">Fashion</a>
                    <a href="street/">Street</a>
                    <a href="events/">Events</a>
                </div>
            </details>
            <a class="nav-cta" href="contact/">Contact</a>
        </nav>
    </header>
    <main class="landing-main">
        <section class="hero-carousel" aria-label="Featured photography" aria-roledescription="carousel">
            <div class="hero-slides">
                <figure class="hero-slide is-active" aria-roledescription="slide" aria-label="1 of 6">
                    <picture>
                        <source media="(max-width: 760px)" srcset="images/sm/white-blazer-architecture.webp">
                        <img src="images/lg/white-blazer-architecture.webp" alt="White blazer portrait against sculptural architecture">
                    </picture>
                </figure>
                <figure class="hero-slide hero-slide-fashion" aria-roledescription="slide" aria-label="2 of 6" aria-hidden="true">
                    <picture>
                        <source media="(max-width: 760px)" srcset="images/sm/zoo.webp">
                        <img src="images/lg/zoo.webp" alt="Fashion portrait in an animal-print outfit in a stone passageway" loading="lazy">
                    </picture>
                </figure>
                <figure class="hero-slide" aria-roledescription="slide" aria-label="3 of 6" aria-hidden="true">
                    <picture>
                        <source media="(max-width: 760px)" srcset="images/sm/portrait-against-wall.webp">
                        <img src="images/lg/portrait-against-wall.webp" alt="Portrait against a wall" loading="lazy">
                    </picture>
                </figure>
                <figure class="hero-slide" aria-roledescription="slide" aria-label="4 of 6" aria-hidden="true">
                    <picture>
                        <source media="(max-width: 760px)" srcset="images/sm/hooray.webp">
                        <img src="images/lg/hooray.webp" alt="Portrait in an animal-print outfit by a stone wall" loading="lazy">
                    </picture>
                </figure>
                <figure class="hero-slide" aria-roledescription="slide" aria-label="5 of 6" aria-hidden="true">
                    <picture>
                        <source media="(max-width: 760px)" srcset="images/sm/graffiti.webp">
                        <img src="images/lg/graffiti.webp" alt="Street portrait against a colorful graffiti-covered wall" loading="lazy">
                    </picture>
                </figure>
                <figure class="hero-slide hero-slide-events" aria-roledescription="slide" aria-label="6 of 6" aria-hidden="true">
                    <picture>
                        <source media="(max-width: 760px)" srcset="images/sm/nero.webp">
                        <img src="images/lg/nero.webp" alt="Portrait at a film premiere" loading="lazy">
                    </picture>
                </figure>
            </div>
            <div class="hero-controls" aria-label="Carousel controls">
                <div class="hero-pagination" aria-label="Choose a slide">
                    <button class="hero-dot is-active" type="button" aria-label="Show slide 1" aria-current="true"></button>
                    <button class="hero-dot" type="button" aria-label="Show slide 2"></button>
                    <button class="hero-dot" type="button" aria-label="Show slide 3"></button>
                    <button class="hero-dot" type="button" aria-label="Show slide 4"></button>
                    <button class="hero-dot" type="button" aria-label="Show slide 5"></button>
                    <button class="hero-dot" type="button" aria-label="Show slide 6"></button>
                </div>
            </div>
            <span class="hero-scroll-hint" aria-hidden="true">Scroll to explore <span>&darr;</span></span>
        </section>

        <section class="category-section" aria-label="Photography portfolios">
            <a class="category-card category-headshots" href="portrait/">
                <picture>
                    <source media="(max-width: 760px)" srcset="images/sm/white-blazer-architecture.webp">
                    <img src="images/lg/white-blazer-architecture.webp" alt="White blazer portrait against sculptural architecture" loading="lazy">
                </picture>
                <span class="category-card-label"><span>Headshots</span><span class="category-card-more">See more</span></span>
            </a>
            <a class="category-card category-fashion" href="fashion/">
                <img src="images/black-dress-editorial.jpg" alt="Fashion portrait in a black dress" loading="lazy">
                <span class="category-card-label"><span>Fashion</span><span class="category-card-more">See more</span></span>
            </a>
            <a class="category-card category-street" href="street/">
                <img src="images/street-road-sign.jpg" alt="Green street sign layered with graffiti" loading="lazy">
                <span class="category-card-label"><span>Street</span><span class="category-card-more">See more</span></span>
            </a>
            <a class="category-card category-events" href="events/">
                <picture>
                    <source media="(max-width: 760px)" srcset="images/sm/nero.webp">
                    <img src="images/lg/nero.webp" alt="Portrait at a film premiere" loading="lazy">
                </picture>
                <span class="category-card-label"><span>Events</span><span class="category-card-more">See more</span></span>
            </a>
        </section>
    </main>
    <footer class="site-footer">
        <span>Copyright 2026 by London Oliver. ALL RIGHTS RESERVED.</span>
        <nav class="footer-links" aria-label="Social links">
            <a class="instagram-link" href="https://www.instagram.com/londonoliverphotography" target="_blank" rel="noopener noreferrer" aria-label="Instagram: @londonoliverphotography">
                <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle class="instagram-icon-dot" cx="18" cy="6" r="1"></circle></svg>
            </a>
        </nav>
    </footer>
    <script src="menu.js" defer></script>
    <script src="carousel.js" defer></script>
</body>
</html>
