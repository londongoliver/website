<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Headshot, fashion, street, and event photography by London Oliver. Available for creative commissions.">
    <meta name="theme-color" content="#ffffff">
    <title>Photography | London Oliver</title>
    <link rel="stylesheet" href="portfolio.css">
</head>
<body class="landing-page">
    <header class="site-header landing-header">
        <a class="wordmark" href="./" aria-label="London Oliver photography home">London Oliver <span>/ Photography</span></a>
        <nav class="site-nav" aria-label="Photography categories">
            <details class="portfolio-menu">
                <summary>Portfolio</summary>
                <div class="portfolio-dropdown">
                    <a href="portrait/">Headshots</a>
                    <a href="fashion/">Fashion</a>
                    <a href="street/">Street</a>
                    <a href="events/">Events</a>
                </div>
            </details>
            <a class="nav-cta" href="contact/">Contact</a>
        </nav>
    </header>
    <main class="landing-main">
        <section class="hero-carousel" aria-label="Featured photography" aria-roledescription="carousel">
            <div class="hero-slides">
                <figure class="hero-slide is-active" aria-roledescription="slide" aria-label="1 of 4">
                    <img src="images/white-suit-portrait.jpg" alt="Portrait in a white blazer against sculptural architecture">
                </figure>
                <figure class="hero-slide hero-slide-fashion" aria-roledescription="slide" aria-label="2 of 4" aria-hidden="true">
                    <img src="images/black-dress-editorial.jpg" alt="Fashion portrait in a black dress" loading="lazy">
                </figure>
                <figure class="hero-slide" aria-roledescription="slide" aria-label="3 of 4" aria-hidden="true">
                    <img src="images/street-tunnel.jpg" alt="Concrete pedestrian tunnel opening into bright light" loading="lazy">
                </figure>
                <figure class="hero-slide hero-slide-events" aria-roledescription="slide" aria-label="4 of 4" aria-hidden="true">
                    <img src="images/film-event-portrait.jpg" alt="Portrait at a film premiere" loading="lazy">
                </figure>
            </div>
            <div class="hero-controls" aria-label="Carousel controls">
                <div class="hero-pagination" aria-label="Choose a slide">
                    <button class="hero-dot is-active" type="button" aria-label="Show slide 1" aria-current="true"></button>
                    <button class="hero-dot" type="button" aria-label="Show slide 2"></button>
                    <button class="hero-dot" type="button" aria-label="Show slide 3"></button>
                    <button class="hero-dot" type="button" aria-label="Show slide 4"></button>
                </div>
            </div>
            <span class="hero-scroll-hint" aria-hidden="true">Scroll to explore <span>&darr;</span></span>
        </section>

        <section class="category-section" aria-label="Photography portfolios">
            <a class="category-card category-headshots" href="portrait/">
                <img src="images/portrait-studio.jpg" alt="Headshot leaning against a textured stone wall" loading="lazy">
                <span class="category-card-label"><span>Headshots</span><span class="category-card-more">See more</span></span>
            </a>
            <a class="category-card category-fashion" href="fashion/">
                <img src="images/black-dress-editorial.jpg" alt="Fashion portrait in a black dress" loading="lazy">
                <span class="category-card-label"><span>Fashion</span><span class="category-card-more">See more</span></span>
            </a>
            <a class="category-card category-street" href="street/">
                <img src="images/street-road-sign.jpg" alt="Green street sign layered with graffiti" loading="lazy">
                <span class="category-card-label"><span>Street</span><span class="category-card-more">See more</span></span>
            </a>
            <a class="category-card category-events" href="events/">
                <img src="images/film-event-portrait.jpg" alt="Portrait at a film premiere" loading="lazy">
                <span class="category-card-label"><span>Events</span><span class="category-card-more">See more</span></span>
            </a>
        </section>
    </main>
    <footer class="site-footer">
        <span>Copyright 2026 by London Oliver. ALL RIGHTS RESERVED.</span>
        <nav class="footer-links" aria-label="Social links">
            <a href="https://www.instagram.com/londonoliverphotography" target="_blank" rel="noopener noreferrer">@londonoliverphotography</a>
        </nav>
    </footer>
    <script src="menu.js" defer></script>
    <script src="carousel.js" defer></script>
</body>
</html>
