<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact London Oliver for acting inquiries.">
    <title>London Oliver | Actor • Los Angeles</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap');

        :root {
            color-scheme: dark;
            --ink: #f2efe9;
            --muted: #aaa49b;
            --line: #3c3a36;
            --paper: #171716;
            --accent: #d9a35f;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: radial-gradient(circle at 78% 12%, rgba(217, 163, 95, .12), transparent 28rem), var(--paper); color: var(--ink); font-family: 'Manrope', Arial, sans-serif; }
        header, main { margin: 0; width: 100%; }
        header { align-items: center; display: flex; justify-content: space-between; padding: 30px clamp(16px, 4vw, 48px) 18px; }
        .identity { color: var(--ink); font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(.9rem, 1.8vw, 1.2rem); font-weight: 800; letter-spacing: .12em; line-height: 1.05; max-width: 10ch; text-decoration: none; text-transform: uppercase; }
        nav a { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
        nav a:hover, nav a:focus { color: var(--accent); }
        .main-nav { align-items: center; display: flex; gap: clamp(22px, 4vw, 64px); }
        .main-nav a { font-size: clamp(.75rem, 1.1vw, .95rem); position: relative; transition: color .25s ease; }
        .main-nav a[aria-current="page"] { color: var(--accent); }
        .main-nav a[aria-current="page"]::after { transform: scaleX(1); transform-origin: left; }
        .main-nav a::after { background: var(--accent); bottom: -9px; content: ''; height: 2px; left: 0; position: absolute; transform: scaleX(0); transform-origin: right; transition: transform .25s ease; width: 100%; }
        .main-nav a:hover::after, .main-nav a:focus-visible::after { transform: scaleX(1); transform-origin: left; }
        .menu-toggle { align-items: center; background: transparent; border: 0; color: var(--ink); cursor: pointer; display: none; flex-direction: column; gap: 5px; padding: 8px 2px; }
        .menu-toggle span { background: currentColor; display: block; height: 2px; width: 28px; }
        main { padding: clamp(24px, 4vw, 56px) clamp(16px, 4vw, 48px) clamp(64px, 10vw, 128px); }
        h1 { font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(2.5rem, 4.5vw, 5rem); font-weight: 800; line-height: .95; margin: 0 0 28px; max-width: none; text-transform: uppercase; }
        h1 span { display: inline; }
        h1 span:last-child { color: var(--accent); }
        .contact-lede { color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.25rem); line-height: 1.7; margin: 0 0 48px; max-width: 38rem; }
        .contact-lede a { color: var(--accent); text-underline-offset: .18em; }
        .contact-lede a:hover, .contact-lede a:focus { color: var(--ink); }
        .contact-layout { align-items: start; display: grid; gap: clamp(20px, 2.5vw, 36px); grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
        .contact-layout--form-disabled { grid-template-columns: minmax(0, .9fr) minmax(260px, 1fr); }
        .contact-portrait { margin: 0; max-width: 400px; position: relative; width: 100%; }
        .contact-portrait::before { border: 2px solid rgba(217, 163, 95, .45); content: ''; inset: -4% 4% 4% -4%; position: absolute; z-index: 0; }
        .contact-portrait img { aspect-ratio: 4 / 5; box-shadow: 0 22px 48px rgba(0, 0, 0, .35); display: block; object-fit: cover; position: relative; width: 100%; z-index: 1; }
        .contact-card { padding: 22px 0; position: relative; }
        .contact-card::before { border-top: 1px solid var(--line); content: ''; left: 0; position: absolute; top: 0; width: min(70%, 28rem); }
        .contact-card h2 { color: var(--accent); font-size: .68rem; font-weight: 700; letter-spacing: .14em; margin: 0 0 12px; text-transform: uppercase; }
        .contact-card p { color: var(--muted); line-height: 1.6; margin: 0; }
        .contact-card a { color: var(--ink); font-weight: 700; text-decoration: none; }
        .contact-card a:hover, .contact-card a:focus { color: var(--accent); }
        form { display: grid; gap: 18px; }
        label { color: var(--accent); font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        input, textarea { background: transparent; border: 1px solid var(--line); color: var(--ink); display: block; font: inherit; margin-top: 8px; padding: 14px 16px; width: 100%; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }
        textarea { min-height: 160px; resize: vertical; }
        button[type="submit"] { background: var(--accent); border: 0; border-radius: 999px; color: #171716; cursor: pointer; font-size: .68rem; font-weight: 700; letter-spacing: .14em; justify-self: start; padding: 16px 28px; text-transform: uppercase; }
        button[type="submit"]:hover, button[type="submit"]:focus { background: var(--ink); }
        .form-status { color: var(--muted); font-size: .95rem; margin: 0; min-height: 1.4em; }
        .site-footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; letter-spacing: .04em; padding: 28px 0 36px; }
        .footer-inner { align-items: center; display: flex; justify-content: space-between; margin: 0; padding: 0 clamp(16px, 4vw, 48px); width: 100%; }
        .social-links { display: flex; gap: clamp(20px, 4vw, 48px); }
        .social-links a { color: var(--ink); font-weight: 700; text-decoration: none; }
        .social-links a:hover, .social-links a:focus { color: var(--accent); }

        @media (max-width: 700px) {
            header, main { width: 100%; }
            header { padding: 18px 16px; }
            main { padding-left: 16px; padding-right: 16px; }
            main { padding-top: 32px; }
            .footer-inner { padding-left: 16px; padding-right: 16px; width: 100%; }
            .menu-toggle { display: flex; }
            .main-nav { align-items: stretch; background: var(--paper); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); display: none; flex-direction: column; gap: 0; left: 0; padding: 8px 16px 12px; position: absolute; right: 0; text-align: left; top: 62px; z-index: 2; }
            .main-nav a { font-size: clamp(.75rem, 2.4vw, .95rem); padding: 16px 0; }
            .main-nav a::after { display: none; }
            .main-nav.is-open { display: flex; }
            h1 { font-size: clamp(2.8rem, 9vw, 4rem); }
            .contact-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <a class="identity" href="/">London Oliver</a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
            <a href="/acting/">Home</a>
            <a href="/acting/bio/">About</a>
            <a href="/acting/resume/">Resume</a>
            <a href="/acting/gallery/">Gallery</a>
            <a href="/acting/contact/" aria-current="page">Contact</a>
        </nav>
    </header>
    <main>
        <div class="contact-layout contact-layout--form-disabled">
            <section aria-label="Contact details">
                <h1><span>Get in</span> <span>Touch</span></h1>
                <p class="contact-lede"><a href="https://www.instagram.com/londonoliver" target="_blank" rel="noopener noreferrer">Message me on Instagram</a></p>
                <div class="contact-card">
                    <h2>Representation</h2>
                    <p><a href="https://www.mza.agency/" target="_blank" rel="noopener noreferrer">Michael Zanuck Agency</a><br>Los Angeles, California</p>
                </div>
                <div class="contact-card">
                    <h2>Social</h2>
                    <p>
                        <a href="https://www.instagram.com/londonoliver" target="_blank" rel="noopener noreferrer">Instagram</a><br>
                    </p>
                </div>
            </section>
            <figure class="contact-portrait">
                <img src="../images/london-oliver-acting-headshot-tie-dye.webp" alt="London Oliver in colorful tie-dye clothing and a red bandana" loading="lazy">
            </figure>
            <!--
            <form id="contact-form" aria-label="Direct inquiry form">
                <label>Name
                    <input type="text" name="name" autocomplete="name" required>
                </label>
                <label>Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label>Message
                    <textarea name="message" required></textarea>
                </label>
                <button type="submit">Send message</button>
                <p class="form-status" role="status" aria-live="polite"></p>
            </form>
            -->
        </div>
    </main>
    <footer class="site-footer">
        <div class="footer-inner">
            <span>&copy; 2026 London Oliver</span>
            <nav class="social-links" aria-label="Social links">
                <a href="https://www.instagram.com/londonoliver" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://www.imdb.com/name/nm18956927/" target="_blank" rel="noopener noreferrer">IMDb</a>
                <a href="https://www.backstage.com/u/london-oliver/" target="_blank" rel="noopener noreferrer">Backstage</a>
            </nav>
        </div>
    </footer>
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const mainNav = document.querySelector('.main-nav');
        menuToggle.addEventListener('click', () => {
            const isOpen = mainNav.classList.toggle('is-open');
            menuToggle.setAttribute('aria-expanded', isOpen);
        });
        mainNav.querySelectorAll('a').forEach((link) => {
            link.addEventListener('click', () => {
                mainNav.classList.remove('is-open');
                menuToggle.setAttribute('aria-expanded', 'false');
            });
        });

            const data = new FormData(form);

        });
        */
    </script>
</body>
</html>
