<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acting portfolio for London Oliver.">
    <title>Acting - London Oliver</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap');

        :root {
            color-scheme: dark;
            --ink: #f2efe9;
            --muted: #aaa49b;
            --line: #3c3a36;
            --paper: #171716;
            --accent: #d9a35f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(circle at 78% 12%, rgba(217, 163, 95, .12), transparent 28rem), var(--paper);
            color: var(--ink);
            font-family: 'Manrope', Arial, sans-serif;
        }

        header, main { margin: 0; width: 100%; }
        main { padding: 0 clamp(16px, 4vw, 48px) clamp(64px, 10vw, 128px); }

        header {
            align-items: center;
            display: flex;
            justify-content: space-between;
            padding: 30px clamp(16px, 4vw, 48px) 18px;
        }

        .identity { color: var(--ink); font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(.9rem, 1.8vw, 1.2rem); font-weight: 800; letter-spacing: .12em; line-height: 1.05; max-width: 10ch; text-decoration: none; text-transform: uppercase; }
        nav a { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
        nav a:hover, nav a:focus { color: var(--accent); }
        .main-nav { align-items: center; display: flex; gap: clamp(22px, 4vw, 64px); }
        .main-nav a { position: relative; transition: color .25s ease; }
        .main-nav a[aria-current="page"] { color: var(--accent); }
        .main-nav a[aria-current="page"]::after { transform: scaleX(1); transform-origin: left; }
        .main-nav a::after { background: var(--accent); bottom: -9px; content: ''; height: 2px; left: 0; position: absolute; transform: scaleX(0); transform-origin: right; transition: transform .25s ease; width: 100%; }
        .main-nav a:hover::after, .main-nav a:focus-visible::after { transform: scaleX(1); transform-origin: left; }
        .menu-toggle { align-items: center; background: transparent; border: 0; color: var(--ink); cursor: pointer; display: none; flex-direction: column; gap: 5px; padding: 8px 2px; }
        .menu-toggle span { background: currentColor; display: block; height: 2px; transition: transform .25s ease, width .25s ease; width: 28px; }
        .menu-toggle span:nth-child(2) { width: 20px; }
        .menu-toggle[aria-expanded="true"] span:first-child { transform: translateY(7px) rotate(45deg); }
        .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
        .menu-toggle[aria-expanded="true"] span:last-child { transform: translateY(-7px) rotate(-45deg); }
        .reel-link { background: var(--accent); border-radius: 999px; color: #171716; display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .14em; padding: 16px 24px; text-decoration: none; text-transform: uppercase; transition: background .25s ease, transform .25s ease; }
        .intro-meta .reel-link::before { content: '▶'; display: inline-block; font-size: .72rem; margin-right: 10px; }
        .reel-link:hover, .reel-link:focus { background: var(--ink); color: #171716; transform: translateY(-2px); }

        .intro { padding: clamp(28px, 4vw, 64px) 0 72px; }
        .intro-copy { max-width: none; }
        h1 { font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(3.5rem, 8vw, 7rem); font-weight: 800; line-height: .86; margin: 18px 0 28px; max-width: 8ch; text-transform: uppercase; }
        h1 span { display: block; }
        h1 span:last-child { color: var(--accent); }
        .intro-meta { align-items: center; display: flex; gap: 24px; justify-content: space-between; max-width: 850px; }
        .location { color: var(--muted); font-size: clamp(1rem, 2vw, 1.35rem); font-weight: 600; letter-spacing: .04em; margin: 0; }
        .reel-section { align-items: start; display: grid; gap: clamp(28px, 7vw, 100px); grid-template-columns: minmax(150px, .35fr) minmax(0, 1fr); margin-top: 120px; padding: 28px clamp(16px, 3vw, 32px) 36px; }
        .reels-heading { margin: 0; padding-top: 12px; text-align: left; }
        .reels-heading h2 { color: var(--accent); font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(2.5rem, 6vw, 5.5rem); font-weight: 700; line-height: .82; margin: 0; max-width: 4ch; text-transform: uppercase; }
        .reels-heading p { color: var(--muted); font-size: .95rem; line-height: 1.6; margin: 24px 0 0; max-width: 18rem; }
        .reels-heading .reel-link { background: transparent; border-bottom: 4px solid var(--accent); border-radius: 0; color: var(--accent); margin-left: 0; margin-top: 28px; padding: 0 0 10px; width: 100%; }
        .reels-heading .reel-link::before { content: none; }
        .reels-heading .reel-link:hover, .reels-heading .reel-link:focus { background: transparent; color: var(--ink); transform: none; }
        .reels { display: grid; gap: 24px 12px; grid-template-columns: minmax(0, 1fr); margin: 0; max-width: none; padding: 0; position: relative; width: 100%; }
        .reel { margin: 0; }
        .reel iframe { aspect-ratio: 16 / 9; border: 0; box-shadow: 0 18px 36px rgba(0, 0, 0, .3); display: block; width: 100%; }

        .headshots { margin-top: 0; }
        .gallery { align-items: start; display: grid; gap: clamp(10px, 2vw, 24px); grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .portrait { background: transparent; border: 0; border-radius: 8px; cursor: zoom-in; display: block; overflow: hidden; padding: 0; position: relative; }
        .portrait:nth-child(2) { transform: translateY(clamp(24px, 3vw, 42px)); }
        .portrait:nth-child(3) { transform: translateY(clamp(-16px, -1vw, -8px)); }
        .portrait:nth-child(4) { transform: translateY(clamp(12px, 2vw, 28px)); }
        .portrait img { aspect-ratio: 4 / 5; display: block; object-fit: cover; transition: transform .5s ease, filter .5s ease; width: 100%; }
        .portrait:hover img, .portrait:focus-visible img { filter: brightness(.78); transform: scale(1.025); }

        .site-footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; letter-spacing: .04em; padding: 28px 0 36px; }
        .footer-inner { align-items: center; display: flex; justify-content: space-between; margin: 0; padding: 0 clamp(16px, 4vw, 48px); width: 100%; }
        .social-links { display: flex; gap: clamp(20px, 4vw, 48px); }
        .social-links a { color: var(--ink); font-weight: 700; text-decoration: none; }
        .social-links a:hover, .social-links a:focus { color: var(--accent); }

        dialog { background: #111; border: 1px solid var(--line); color: var(--ink); max-height: 92vh; max-width: min(92vw, 700px); padding: 0; }
        dialog::backdrop { background: rgba(0, 0, 0, .88); }
        dialog img { display: block; max-height: 86vh; max-width: 90vw; object-fit: contain; }
        .close { background: rgba(0, 0, 0, .65); border: 1px solid #777; color: white; cursor: pointer; font-size: 1.4rem; line-height: 1; padding: 8px 12px; position: absolute; right: 12px; top: 12px; }

        @media (max-width: 1100px) {
            .reel-section { display: grid; gap: clamp(12px, 5vw, 48px); grid-template-columns: clamp(90px, 25vw, 220px) minmax(0, 1fr); margin-top: 88px; }
            .reels-heading { margin-bottom: 0; }
            .reels-heading h2 { max-width: 4ch; }
            .reels-heading p { font-size: .78rem; margin-top: 16px; }
            .reels-heading .reel-link { margin-top: 18px; }
        }

        @media (max-width: 700px) {
            header, main { width: 100%; }
            header { padding: 18px 16px 18px; }
            main { padding-left: 16px; padding-right: 16px; }
            .footer-inner { padding-left: 16px; padding-right: 16px; width: 100%; }
            .menu-toggle { display: flex; }
            .main-nav { align-items: stretch; background: var(--paper); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); display: none; flex-direction: column; gap: 0; left: 0; padding: 8px 16px 12px; position: absolute; right: 0; text-align: left; top: 62px; z-index: 2; }
            .main-nav a { font-size: .78rem; padding: 16px 0; }
            .main-nav a::after { display: none; }
            .main-nav.is-open { display: flex; }
            .intro { padding: 24px 0 30px; }
            .intro-meta { align-items: flex-start; flex-direction: column; gap: 18px; }
            .intro-meta { justify-content: flex-start; max-width: none; }
            .gallery { gap: 5px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .reel-section { margin-top: 72px; padding-left: 0; padding-right: 0; }
        }
    </style>
</head>
<body>
    <header>
        <a class="identity" href="/">London Oliver</a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
            <a href="/acting/" aria-current="page">Home</a>
            <a href="/acting/bio/">About</a>
            <a href="/acting/resume/">Resume</a>
            <a href="/acting/gallery/">Gallery</a>
            <a href="/acting/contact/">Contact</a>
        </nav>
    </header>
    <main>
        <section class="intro">
            <div class="intro-copy">
                <h1><span>London</span><span>Oliver</span></h1>
                <div class="intro-meta">
                    <p class="location">Actor in Los Angeles</p>
                    <a class="reel-link" href="#reel">Watch the reel</a>
                </div>
            </div>
        </section>
        <section class="headshots" id="photos" aria-label="Selected portraits">
            <div class="gallery">
                <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-blue-plaid-shirt.webp">
                    <img src="images/london-oliver-acting-headshot-blue-plaid-shirt.webp" alt="London Oliver in a blue plaid shirt" fetchpriority="high">
                </button>
                <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-cowboy.webp">
                    <img src="images/london-oliver-acting-headshot-cowboy.webp" alt="London Oliver in a cowboy hat and red shirt" loading="lazy">
                </button>
                <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-tie-dye.webp">
                    <img src="images/london-oliver-acting-headshot-tie-dye.webp" alt="London Oliver in tie-dye clothing and a red bandana" loading="lazy">
                </button>
                <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-black-suit.webp">
                    <img src="images/london-oliver-acting-headshot-black-suit.webp" alt="London Oliver in a black suit" loading="lazy">
                </button>
            </div>
        </section>
        <section class="reel-section" id="reel" aria-label="Acting reel">
            <div class="reels-heading">
                <h2>Reel</h2>
                <p>A few minutes of screen work, from comedy to character.</p>
                <a class="reel-link" href="/acting/bio/">More about London &rarr;</a>
            </div>
            <div class="reels">
                <figure class="reel">
                    <iframe src="https://www.youtube.com/embed/1rSbOT8Rd8Q" title="London Oliver Acting Reel" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </figure>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-inner">
            <span>&copy; 2026 London Oliver</span>
            <nav class="social-links" aria-label="Social links">
                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a>
            </nav>
        </div>
    </footer>
    <dialog id="lightbox" aria-label="Expanded portrait">
        <button class="close" type="button" aria-label="Close image">&times;</button>
        <img id="lightbox-image" src="" alt="">
    </dialog>
    <script>
        const lightbox = document.querySelector('#lightbox');
        const lightboxImage = document.querySelector('#lightbox-image');

        document.querySelectorAll('.portrait').forEach((portrait) => {
            portrait.addEventListener('click', () => {
                lightboxImage.src = portrait.dataset.image;
                lightboxImage.alt = portrait.querySelector('img').alt;
                lightbox.showModal();
            });
        });

        document.querySelector('.close').addEventListener('click', () => lightbox.close());
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) lightbox.close();
        });

        const menuToggle = document.querySelector('.menu-toggle');
        const mainNav = document.querySelector('.main-nav');

        menuToggle.addEventListener('click', () => {
            const isOpen = mainNav.classList.toggle('is-open');
            menuToggle.setAttribute('aria-expanded', isOpen);
        });

        mainNav.querySelectorAll('a').forEach((link) => {
            link.addEventListener('click', () => {
                mainNav.classList.remove('is-open');
                menuToggle.setAttribute('aria-expanded', 'false');
            });
        });
    </script>
</body>
</html>
