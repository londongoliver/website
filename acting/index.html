<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acting portfolio for London Oliver.">
    <title>Acting - London Oliver</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #f2efe9;
            --muted: #aaa49b;
            --line: #3c3a36;
            --paper: #171716;
            --accent: #d9a35f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(circle at 78% 12%, rgba(217, 163, 95, .12), transparent 28rem), var(--paper);
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
        }

        header, main { margin: auto; width: min(1080px, calc(100% - clamp(32px, 7vw, 96px))); }
        main { padding-bottom: clamp(64px, 10vw, 128px); }

        header {
            align-items: baseline;
            display: flex;
            justify-content: space-between;
            padding: 30px 0 18px;
        }

        .identity { color: var(--ink); font-size: 1.1rem; letter-spacing: .03em; text-decoration: none; }
        nav a { color: var(--muted); font-family: Arial, sans-serif; font-size: .72rem; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
        nav a:hover, nav a:focus { color: var(--accent); }
        .bio-link { background: var(--accent); color: #171716; display: inline-block; font-family: Arial, sans-serif; font-size: .68rem; letter-spacing: .14em; margin-top: 28px; padding: 13px 17px; text-decoration: none; text-transform: uppercase; transition: background .25s ease, transform .25s ease; }
        .bio-link:hover, .bio-link:focus { background: var(--ink); color: #171716; transform: translateY(-2px); }

        .intro { align-items: end; display: grid; gap: clamp(28px, 7vw, 112px); grid-template-columns: minmax(0, 1fr) minmax(280px, 430px); padding: clamp(70px, 12vw, 150px) 0 72px; }
        .intro-copy { grid-column: 1; grid-row: 1; min-width: 0; }
        .intro-portrait { grid-column: 2; grid-row: 1; margin: 0; max-width: 430px; justify-self: end; position: relative; width: 100%; }
        .intro-portrait::before { background: var(--accent); content: ''; inset: 20px 0 -20px 20px; position: absolute; z-index: 0; }
        .intro-portrait img { aspect-ratio: 4 / 5; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); display: block; object-fit: cover; object-position: center; position: relative; width: 100%; z-index: 1; }
        .eyebrow { color: var(--accent); font-family: Arial, sans-serif; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; }
        h1 { font-size: clamp(4rem, 11vw, 9rem); font-weight: normal; letter-spacing: -.04em; line-height: .84; margin: 18px 0 28px; max-width: 8ch; }
        .location { color: var(--ink); font-family: Arial, sans-serif; font-size: clamp(1rem, 2vw, 1.35rem); font-weight: bold; letter-spacing: .16em; margin: 0; text-transform: uppercase; }
        .reel-section { align-items: start; display: grid; gap: clamp(28px, 7vw, 100px); grid-template-columns: minmax(150px, .35fr) minmax(0, 1fr); margin-top: 56px; }
        .reels-heading { margin: 0; padding-top: 12px; text-align: left; }
        .reels-heading h2 { color: var(--accent); font-size: clamp(2.5rem, 6vw, 5.5rem); font-style: italic; font-weight: normal; letter-spacing: -.04em; line-height: .82; margin: 0; max-width: 4ch; }
        .reels-heading h2::after { background: var(--accent); content: ''; display: block; height: 1px; margin-top: 28px; width: 72px; }
        .reels { background: #24231f; border-left: 8px solid var(--accent); display: grid; gap: 24px 12px; grid-template-columns: minmax(0, 1fr); margin: 0; max-width: none; padding: clamp(12px, 2.5vw, 28px); position: relative; width: 100%; }
        .reels::after { border: 1px solid rgba(217, 163, 95, .45); content: ''; inset: 12px -12px -12px 12px; pointer-events: none; position: absolute; z-index: -1; }
        .reel { margin: 0; }
        .reel iframe { aspect-ratio: 16 / 9; border: 0; box-shadow: 0 18px 36px rgba(0, 0, 0, .35); display: block; width: 100%; }

        .headshots { margin-top: 104px; }
        .gallery { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
        .portrait { background: #252421; border: 0; cursor: zoom-in; display: block; overflow: hidden; padding: 0; position: relative; }
        .portrait img { aspect-ratio: 4 / 5; display: block; object-fit: cover; transition: transform .5s ease, filter .5s ease; width: 100%; }
        .portrait:hover img, .portrait:focus-visible img { filter: brightness(.78); transform: scale(1.025); }

        dialog { background: #111; border: 1px solid var(--line); color: var(--ink); max-height: 92vh; max-width: min(92vw, 700px); padding: 0; }
        dialog::backdrop { background: rgba(0, 0, 0, .88); }
        dialog img { display: block; max-height: 86vh; max-width: 90vw; object-fit: contain; }
        .close { background: rgba(0, 0, 0, .65); border: 1px solid #777; color: white; cursor: pointer; font-size: 1.4rem; line-height: 1; padding: 8px 12px; position: absolute; right: 12px; top: 12px; }

        @media (max-width: 1100px) {
            .intro { align-items: start; display: flex; flex-direction: column; gap: 48px; }
            .intro-portrait { align-self: center; }
        }

        @media (max-width: 700px) {
            header, main { width: min(100% - 32px, 560px); }
            header { padding-top: 18px; }
            .intro { display: flex; flex-direction: column; gap: 34px; padding: 40px 0 30px; }
            .intro-portrait { align-self: stretch; max-width: none; order: -1; }
            .intro-portrait::before { inset: 10px 0 -10px 10px; }
            .gallery { gap: 8px; grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 1100px) {
            .reel-section { display: block; margin-top: 48px; }
            .reels-heading { margin-bottom: 26px; }
            .reels-heading h2 { max-width: none; }
        }
    </style>
</head>
<body>
    <header>
        <a class="identity" href="/">London Oliver</a>
        <nav aria-label="Main navigation"><a href="/">All work</a></nav>
    </header>
    <main>
        <section class="intro">
            <figure class="intro-portrait">
                <img src="images/london-oliver-acting-headshot-blue-plaid-shirt.webp" alt="London Oliver in a blue plaid shirt">
            </figure>
            <div class="intro-copy">
                <h1>London Oliver</h1>
                <p class="location">Actor / Los Angeles</p>
                <a class="bio-link" href="/bio/">Read bio</a>
            </div>
        </section>
        <section class="reel-section" aria-label="Acting reel">
            <div class="reels-heading">
                <h2>Acting Reel</h2>
            </div>
            <div class="reels">
                <figure class="reel">
                    <iframe src="https://www.youtube.com/embed/1rSbOT8Rd8Q" title="London Oliver Acting Reel" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </figure>
            </div>
        </section>
        <section class="headshots" aria-label="Headshots">
            <div class="gallery">
            <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-blue-plaid-shirt.webp" data-caption="Blue plaid shirt">
                <img src="images/london-oliver-acting-headshot-blue-plaid-shirt.webp" alt="London Oliver acting headshot in a blue plaid shirt" fetchpriority="high">
            </button>
            <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-cowboy.webp" data-caption="Cowboy hat and red shirt">
                <img src="images/london-oliver-acting-headshot-cowboy.webp" alt="London Oliver acting headshot in a cowboy hat and red shirt" loading="lazy">
            </button>
            <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-tie-dye.webp" data-caption="Tie-dye shirt and red bandana">
                <img src="images/london-oliver-acting-headshot-tie-dye.webp" alt="London Oliver acting headshot in colorful tie-dye clothing" loading="lazy">
            </button>
            <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-black-suit.webp" data-caption="Black suit">
                <img src="images/london-oliver-acting-headshot-black-suit.webp" alt="London Oliver acting headshot in a black suit" loading="lazy">
            </button>
            <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-camo-cap-and-vest.webp" data-caption="Camo cap and vest">
                <img src="images/london-oliver-acting-headshot-camo-cap-and-vest.webp" alt="London Oliver acting headshot in a camouflage cap and dark vest" loading="lazy">
            </button>
            <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-hoodie-bandana.webp" data-caption="Denim hoodie and bandana">
                <img src="images/london-oliver-acting-headshot-hoodie-bandana.webp" alt="London Oliver acting headshot in a hoodie and bandana" loading="lazy">
            </button>
            <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-book-and-glasses.webp" data-caption="Book and glasses">
                <img src="images/london-oliver-acting-headshot-book-and-glasses.webp" alt="London Oliver acting headshot reading a book in glasses" loading="lazy">
            </button>
            <button class="portrait" type="button" data-image="images/london-oliver-acting-headshot-ripped-shirt.webp" data-caption="Ripped white shirt">
                <img src="images/london-oliver-acting-headshot-ripped-shirt.webp" alt="London Oliver acting headshot in a ripped white shirt" loading="lazy">
            </button>
            </div>
        </section>
    </main>
    <dialog id="lightbox" aria-label="Expanded portrait">
        <button class="close" type="button" aria-label="Close image">&times;</button>
        <img id="lightbox-image" src="" alt="">
    </dialog>
    <script>
        const lightbox = document.querySelector('#lightbox');
        const lightboxImage = document.querySelector('#lightbox-image');

        document.querySelectorAll('.portrait').forEach((portrait) => {
            portrait.addEventListener('click', () => {
                lightboxImage.src = portrait.dataset.image;
                lightboxImage.alt = portrait.querySelector('img').alt;
                lightbox.showModal();
            });
        });

        document.querySelector('.close').addEventListener('click', () => lightbox.close());
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) lightbox.close();
        });
    </script>
</body>
</html>
