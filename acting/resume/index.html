<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Download London Oliver's acting headshot and resume.">
    <title>Headshot &amp; Resume - London Oliver</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap');

        :root {
            color-scheme: dark;
            --ink: #f2efe9;
            --muted: #aaa49b;
            --line: #3c3a36;
            --paper: #171716;
            --accent: #d9a35f;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: radial-gradient(circle at 78% 12%, rgba(217, 163, 95, .12), transparent 28rem), var(--paper); color: var(--ink); font-family: 'Manrope', Arial, sans-serif; }
        header, main { margin: 0; width: 100%; }
        header { align-items: center; display: flex; justify-content: space-between; padding: 30px clamp(16px, 4vw, 48px) 18px; }
        .identity { color: var(--ink); font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(.9rem, 1.8vw, 1.2rem); font-weight: 800; letter-spacing: .12em; line-height: 1.05; max-width: 10ch; text-decoration: none; text-transform: uppercase; }
        nav a { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
        nav a:hover, nav a:focus { color: var(--accent); }
        .main-nav { align-items: center; display: flex; gap: clamp(22px, 4vw, 64px); }
        .main-nav a { position: relative; transition: color .25s ease; }
        .main-nav a[aria-current="page"] { color: var(--accent); }
        .main-nav a[aria-current="page"]::after { transform: scaleX(1); transform-origin: left; }
        .main-nav a::after { background: var(--accent); bottom: -9px; content: ''; height: 2px; left: 0; position: absolute; transform: scaleX(0); transform-origin: right; transition: transform .25s ease; width: 100%; }
        .main-nav a:hover::after, .main-nav a:focus-visible::after { transform: scaleX(1); transform-origin: left; }
        .menu-toggle { align-items: center; background: transparent; border: 0; color: var(--ink); cursor: pointer; display: none; flex-direction: column; gap: 5px; padding: 8px 2px; }
        .menu-toggle span { background: currentColor; display: block; height: 2px; width: 28px; }
        main { padding: clamp(24px, 4vw, 56px) 0 clamp(64px, 10vw, 128px); }
        .resume-hero { align-items: start; display: grid; gap: clamp(36px, 6vw, 80px); grid-template-columns: minmax(220px, .7fr) minmax(0, 1.4fr); margin-bottom: clamp(48px, 7vw, 88px); }
        .resume-portrait { margin: 0; position: relative; }
        .resume-portrait::before { background: var(--accent); content: ''; inset: 16px 0 -16px 16px; position: absolute; z-index: 0; }
        .resume-portrait img { aspect-ratio: 4 / 5; display: block; object-fit: cover; position: relative; width: 100%; z-index: 1; }
        h1 { font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(3.5rem, 8vw, 7rem); font-weight: 800; line-height: .86; margin: 0 0 28px; max-width: 8ch; text-transform: uppercase; }
        h1 span { display: block; }
        h1 span:last-child { color: var(--accent); }
        .resume-lede { color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.25rem); line-height: 1.7; margin: 0 0 28px; max-width: 36rem; }
        .vitals { display: grid; gap: 18px 32px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; max-width: 28rem; padding: 0; }
        .vitals div { border-top: 1px solid var(--line); padding-top: 12px; }
        .vitals dt { color: var(--accent); font-size: .68rem; font-weight: 700; letter-spacing: .14em; margin: 0 0 6px; text-transform: uppercase; }
        .vitals dd { margin: 0; }
        .vitals a { color: var(--ink); text-decoration: none; }
        .vitals a:hover, .vitals a:focus { color: var(--accent); }
        .resume-actions { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 32px; }
        .resume-actions a { background: var(--accent); border-radius: 999px; color: #171716; font-size: .68rem; font-weight: 700; letter-spacing: .14em; padding: 16px 24px; text-decoration: none; text-transform: uppercase; }
        .resume-actions a:last-child { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .resume-actions a:hover, .resume-actions a:focus { background: var(--ink); border-color: var(--ink); color: #171716; }
        .download-main { margin: 0; max-width: none; padding: clamp(32px, 6vw, 72px) clamp(16px, 4vw, 48px) clamp(64px, 10vw, 128px); width: 100%; }
        .download-page { text-align: left; }
        .download-title { font-size: clamp(1.4rem, 5vw, 3.8rem); line-height: 1; margin: 0 0 clamp(36px, 6vw, 64px); max-width: none; white-space: nowrap; }
        .download-title span { display: inline; }
        .download-title span:first-child { margin-right: .18em; }
        .download-title span:last-child { color: var(--accent); }
        .download-grid { align-items: start; display: grid; gap: clamp(24px, 5vw, 64px); grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .download-item { margin: 0; min-width: 0; }
        .preview-image { background: transparent; border: 0; border-radius: 14px; cursor: zoom-in; display: block; overflow: hidden; padding: 0; width: 100%; }
        .download-item img { aspect-ratio: 4 / 5; border-radius: inherit; display: block; object-fit: contain; width: 100%; }
        .download-item:first-child img { object-fit: cover; }
        .resume-pdf-link { background: #fff; border-radius: 14px; cursor: pointer; display: block; overflow: hidden; }
        .download-item:nth-child(2) img { aspect-ratio: 927 / 1200; }
        .download-links { display: flex; justify-content: center; margin-top: 24px; }
        .download-link { background: var(--accent); border-radius: 999px; color: #171716; display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .14em; padding: 16px 24px; text-align: center; text-decoration: none; text-transform: uppercase; }
        .download-link:hover, .download-link:focus-visible { background: var(--ink); color: var(--paper); }
        .download-link--secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .download-link--secondary:hover, .download-link--secondary:focus-visible { background: var(--accent); color: #171716; }
        dialog { background: #111; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); max-height: 92vh; max-width: min(92vw, 900px); overflow: hidden; padding: 0; }
        dialog::backdrop { background: rgba(0, 0, 0, .88); }
        dialog img { border-radius: 12px; display: block; max-height: 86vh; max-width: 90vw; object-fit: contain; }
        .close { background: rgba(0, 0, 0, .65); border: 1px solid #777; border-radius: 999px; color: white; cursor: pointer; font-size: 1.4rem; line-height: 1; padding: 8px 12px; position: absolute; right: 12px; top: 12px; }
        .credit-block + .credit-block { margin-top: 48px; }
        .credit-block h2 { color: var(--accent); font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; letter-spacing: .08em; margin: 0 0 18px; text-transform: uppercase; }
        .credits { border-top: 1px solid var(--line); margin: 0; padding: 0; width: 100%; }
        .credits .row { border-bottom: 1px solid var(--line); display: grid; gap: 12px; grid-template-columns: minmax(0, 1.4fr) minmax(0, .8fr) minmax(0, 1fr); padding: 16px 0; }
        .credits .project { color: var(--ink); font-weight: 700; }
        .credits .role, .credits .meta { color: var(--muted); }
        .credit-note { color: var(--muted); font-size: .95rem; line-height: 1.6; margin: 16px 0 0; }
        .site-footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; letter-spacing: .04em; padding: 28px 0 36px; }
        .footer-inner { align-items: center; display: flex; justify-content: space-between; margin: 0; padding: 0 clamp(16px, 4vw, 48px); width: 100%; }
        .social-links { display: flex; gap: clamp(20px, 4vw, 48px); }
        .social-links a { color: var(--ink); font-weight: 700; text-decoration: none; }
        .social-links a:hover, .social-links a:focus { color: var(--accent); }

        @media (max-width: 700px) {
            header, main { width: 100%; }
            header { padding-left: 16px; padding-right: 16px; }
            .download-main { padding: 36px 16px clamp(64px, 10vw, 128px); width: 100%; }
            .download-grid { grid-template-columns: 1fr; max-width: 480px; }
            .footer-inner { padding-left: 16px; padding-right: 16px; width: 100%; }
            header { padding-top: 18px; }
            .menu-toggle { display: flex; }
            .main-nav { align-items: stretch; background: var(--paper); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); display: none; flex-direction: column; gap: 0; left: 0; padding: 8px 16px 12px; position: absolute; right: 0; text-align: left; top: 62px; z-index: 2; }
            .main-nav a { padding: 16px 0; }
            .main-nav a::after { display: none; }
            .main-nav.is-open { display: flex; }
            .resume-hero { display: flex; flex-direction: column; gap: 36px; }
            .resume-portrait { align-self: center; max-width: 360px; width: 100%; }
            .vitals { grid-template-columns: 1fr; }
            .credits .row { grid-template-columns: 1fr; gap: 4px; }
        }

        @media print {
            body { background: white; color: #111; }
            header, .resume-actions, .site-footer { display: none; }
            main { width: 100%; padding: 0; }
            .resume-portrait::before { display: none; }
            h1 span:last-child, .vitals dt, .credit-block h2 { color: #8a6428; }
            .credits .role, .credits .meta, .resume-lede, .credit-note { color: #444; }
        }
    </style>
</head>
<body>
    <header>
        <a class="identity" href="/">London Oliver</a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
            <a href="/acting/">Home</a>
            <a href="/acting/bio/">About</a>
            <a href="/acting/resume/" aria-current="page">Resume</a>
            <a href="/acting/gallery/">Gallery</a>
            <a href="/acting/contact/">Contact</a>
        </nav>
    </header>
    <main class="download-main">
        <section class="download-page" aria-labelledby="resume-heading">
            <h1 class="download-title" id="resume-heading"><span>Headshot</span><span>&amp; Resume</span></h1>
            <div class="download-grid">
                <figure class="download-item">
                    <button class="preview-image" type="button" data-image="/acting/images/london-oliver-headshot.jpg">
                        <img src="/acting/images/london-oliver-headshot.jpg" alt="London Oliver in a blue plaid shirt" fetchpriority="high">
                    </button>
                    <figcaption class="download-links">
                        <a class="download-link" href="/acting/images/london-oliver-headshot.jpg" download="London-Oliver-Headshot.jpg">Download headshot</a>
                    </figcaption>
                </figure>
                <figure class="download-item">
                    <a class="resume-pdf-link" href="/acting/resume/london-oliver-acting-resume.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open the resume PDF in your browser">
                        <img src="/acting/resume/london-oliver-resume-preview.jpg" alt="Preview of London Oliver’s acting resume" loading="lazy" decoding="async">
                    </a>
                    <figcaption class="download-links">
                        <a class="download-link download-link--secondary" href="/acting/resume/london-oliver-acting-resume.pdf" download="London-Oliver-Acting-Resume.pdf">Download resume (PDF)</a>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>
    <dialog id="lightbox" aria-label="Expanded preview">
        <button class="close" type="button" aria-label="Close preview">&times;</button>
        <img id="lightbox-image" src="" alt="">
    </dialog>
    <footer class="site-footer">
        <div class="footer-inner">
            <span>&copy; 2026 London Oliver</span>
            <nav class="social-links" aria-label="Social links">
                <a href="https://www.instagram.com/londonoliver/profilecard/?igsh=MzRlODBiNWFlZA==" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://sites.google.com/view/londonoliver" target="_blank" rel="noopener noreferrer">Portfolio</a>
            </nav>
        </div>
    </footer>
    <script>
        const lightbox = document.querySelector('#lightbox');
        const lightboxImage = document.querySelector('#lightbox-image');
        document.querySelectorAll('.preview-image').forEach((preview) => {
            preview.addEventListener('click', () => {
                lightboxImage.src = preview.dataset.image;
                lightboxImage.alt = preview.querySelector('img').alt;
                lightbox.showModal();
            });
        });
        document.querySelector('.close').addEventListener('click', () => lightbox.close());
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) lightbox.close();
        });
        const menuToggle = document.querySelector('.menu-toggle');
        const mainNav = document.querySelector('.main-nav');
        menuToggle.addEventListener('click', () => {
            const isOpen = mainNav.classList.toggle('is-open');
            menuToggle.setAttribute('aria-expanded', isOpen);
        });
        mainNav.querySelectorAll('a').forEach((link) => {
            link.addEventListener('click', () => {
                mainNav.classList.remove('is-open');
                menuToggle.setAttribute('aria-expanded', 'false');
            });
        });
    </script>
</body>
</html>
