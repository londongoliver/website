<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Headshot gallery for London Oliver.">
    <title>Gallery - London Oliver</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap');

        :root {
            color-scheme: dark;
            --ink: #f2efe9;
            --muted: #aaa49b;
            --line: #3c3a36;
            --paper: #171716;
            --accent: #d9a35f;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: radial-gradient(circle at 78% 12%, rgba(217, 163, 95, .12), transparent 28rem), var(--paper); color: var(--ink); font-family: 'Manrope', Arial, sans-serif; }
        header, main { margin: 0; width: 100%; }
        header { align-items: center; display: flex; justify-content: space-between; padding: 30px clamp(16px, 4vw, 48px) 18px; }
        .identity { color: var(--ink); font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(.9rem, 1.8vw, 1.2rem); font-weight: 800; letter-spacing: .12em; line-height: 1.05; max-width: 10ch; text-decoration: none; text-transform: uppercase; }
        nav a { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
        nav a:hover, nav a:focus { color: var(--accent); }
        .main-nav { align-items: center; display: flex; gap: clamp(22px, 4vw, 64px); }
        .main-nav a { position: relative; transition: color .25s ease; }
        .main-nav a[aria-current="page"] { color: var(--accent); }
        .main-nav a[aria-current="page"]::after { transform: scaleX(1); transform-origin: left; }
        .main-nav a::after { background: var(--accent); bottom: -9px; content: ''; height: 2px; left: 0; position: absolute; transform: scaleX(0); transform-origin: right; transition: transform .25s ease; width: 100%; }
        .main-nav a:hover::after, .main-nav a:focus-visible::after { transform: scaleX(1); transform-origin: left; }
        .menu-toggle { align-items: center; background: transparent; border: 0; color: var(--ink); cursor: pointer; display: none; flex-direction: column; gap: 5px; padding: 8px 2px; }
        .menu-toggle span { background: currentColor; display: block; height: 2px; width: 28px; }
        main { padding: clamp(24px, 4vw, 56px) clamp(16px, 4vw, 48px) clamp(64px, 10vw, 128px); }
        .gallery-intro { margin-bottom: clamp(42px, 7vw, 88px); max-width: 760px; }
        .eyebrow { color: var(--accent); font-size: .7rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
        h1 { font-family: 'Montserrat', Arial, sans-serif; font-size: clamp(2.8rem, 5vw, 4.8rem); font-weight: 800; line-height: .9; margin: 18px 0 24px; max-width: 8ch; text-transform: uppercase; }
        h1 span { display: block; }
        h1 span:last-child { color: var(--accent); }
        .gallery-intro p { color: var(--muted); font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.6; margin: 0; max-width: 38rem; }
        .gallery { align-items: start; display: grid; gap: clamp(18px, 2.5vw, 34px); grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .portrait { background: transparent; border: 0; border-radius: 8px; cursor: zoom-in; display: block; overflow: hidden; padding: 0; position: relative; }
        .portrait:nth-child(2), .portrait:nth-child(6) { transform: translateY(clamp(28px, 4vw, 64px)); }
        .portrait:nth-child(3), .portrait:nth-child(7) { transform: translateY(clamp(-18px, -1.5vw, -8px)); }
        .portrait:nth-child(4), .portrait:nth-child(8) { transform: translateY(clamp(16px, 3vw, 48px)); }
        .portrait img { aspect-ratio: 4 / 5; display: block; object-fit: cover; transition: transform .5s ease, filter .5s ease; width: 100%; }
        .portrait:hover img, .portrait:focus-visible img { filter: brightness(.78); transform: scale(1.025); }
        .site-footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; letter-spacing: .04em; padding: 28px 0 36px; }
        .footer-inner { align-items: center; display: flex; justify-content: space-between; margin: 0; padding: 0 clamp(16px, 4vw, 48px); width: 100%; }
        .social-links { display: flex; gap: clamp(20px, 4vw, 48px); }
        .social-links a { color: var(--ink); font-weight: 700; text-decoration: none; }
        .social-links a:hover, .social-links a:focus { color: var(--accent); }
        dialog { background: #111; border: 1px solid var(--line); color: var(--ink); max-height: 92vh; max-width: min(92vw, 900px); padding: 0; }
        dialog::backdrop { background: rgba(0, 0, 0, .88); }
        dialog img { display: block; max-height: 86vh; max-width: 90vw; object-fit: contain; }
        .close { background: rgba(0, 0, 0, .65); border: 1px solid #777; color: white; cursor: pointer; font-size: 1.4rem; line-height: 1; padding: 8px 12px; position: absolute; right: 12px; top: 12px; }

        @media (max-width: 700px) {
            header, main { width: 100%; }
            header { padding: 18px 16px; }
            main { padding-left: 16px; padding-right: 16px; }
            .footer-inner { padding-left: 16px; padding-right: 16px; width: 100%; }
            .menu-toggle { display: flex; }
            .main-nav { align-items: stretch; background: var(--paper); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); display: none; flex-direction: column; gap: 0; left: 0; padding: 8px 16px 12px; position: absolute; right: 0; text-align: left; top: 62px; z-index: 2; }
            .main-nav a { padding: 16px 0; }
            .main-nav a::after { display: none; }
            .main-nav.is-open { display: flex; }
            main { padding-top: 28px; }
            .gallery { gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .portrait:nth-child(2), .portrait:nth-child(6) { transform: translateY(22px); }
            .portrait:nth-child(3), .portrait:nth-child(7) { transform: translateY(-8px); }
            .portrait:nth-child(4), .portrait:nth-child(8) { transform: translateY(18px); }
        }
    </style>
</head>
<body>
    <header>
        <a class="identity" href="/acting/">London Oliver</a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
            <a href="/acting/">Home</a>
            <a href="/acting/bio/">About</a>
            <a href="/acting/resume/">Resume</a>
            <a href="/acting/gallery/" aria-current="page">Gallery</a>
            <a href="/acting/contact/">Contact</a>
        </nav>
    </header>
    <main>
        <section class="gallery-intro" aria-labelledby="gallery-heading">
            <h1 id="gallery-heading"><span>Gallery</span></h1>
        </section>
        <section class="gallery" aria-label="London Oliver headshots">
            <button class="portrait" type="button" data-image="../images/london-oliver-acting-headshot-blue-plaid-shirt.webp"><img src="../images/london-oliver-acting-headshot-blue-plaid-shirt.webp" alt="London Oliver in a blue plaid shirt" fetchpriority="high"></button>
            <button class="portrait" type="button" data-image="../images/london-oliver-acting-headshot-cowboy.webp"><img src="../images/london-oliver-acting-headshot-cowboy.webp" alt="London Oliver in a cowboy hat and red shirt" loading="lazy"></button>
            <button class="portrait" type="button" data-image="../images/london-oliver-acting-headshot-tie-dye.webp"><img src="../images/london-oliver-acting-headshot-tie-dye.webp" alt="London Oliver in tie-dye clothing and a red bandana" loading="lazy"></button>
            <button class="portrait" type="button" data-image="../images/london-oliver-acting-headshot-black-suit.webp"><img src="../images/london-oliver-acting-headshot-black-suit.webp" alt="London Oliver in a black suit" loading="lazy"></button>
            <button class="portrait" type="button" data-image="../images/london-oliver-acting-headshot-camo-cap-and-vest.webp"><img src="../images/london-oliver-acting-headshot-camo-cap-and-vest.webp" alt="London Oliver in a camouflage cap and dark vest" loading="lazy"></button>
            <button class="portrait" type="button" data-image="../images/london-oliver-acting-headshot-hoodie-bandana.webp"><img src="../images/london-oliver-acting-headshot-hoodie-bandana.webp" alt="London Oliver in a hoodie and bandana" loading="lazy"></button>
            <button class="portrait" type="button" data-image="../images/london-oliver-acting-headshot-book-and-glasses.webp"><img src="../images/london-oliver-acting-headshot-book-and-glasses.webp" alt="London Oliver reading a book in glasses" loading="lazy"></button>
            <button class="portrait" type="button" data-image="../images/london-oliver-acting-headshot-ripped-shirt.webp"><img src="../images/london-oliver-acting-headshot-ripped-shirt.webp" alt="London Oliver in a ripped white shirt" loading="lazy"></button>
        </section>
    </main>
    <footer class="site-footer">
        <div class="footer-inner">
            <span>&copy; 2026 London Oliver</span>
            <nav class="social-links" aria-label="Social links">
                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a>
            </nav>
        </div>
    </footer>
    <dialog id="lightbox" aria-label="Expanded portrait">
        <button class="close" type="button" aria-label="Close image">&times;</button>
        <img id="lightbox-image" src="" alt="">
    </dialog>
    <script>
        const lightbox = document.querySelector('#lightbox');
        const lightboxImage = document.querySelector('#lightbox-image');
        document.querySelectorAll('.portrait').forEach((portrait) => {
            portrait.addEventListener('click', () => {
                lightboxImage.src = portrait.dataset.image;
                lightboxImage.alt = portrait.querySelector('img').alt;
                lightbox.showModal();
            });
        });
        document.querySelector('.close').addEventListener('click', () => lightbox.close());
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) lightbox.close();
        });
        const menuToggle = document.querySelector('.menu-toggle');
        const mainNav = document.querySelector('.main-nav');
        menuToggle.addEventListener('click', () => {
            const isOpen = mainNav.classList.toggle('is-open');
            menuToggle.setAttribute('aria-expanded', isOpen);
        });
        mainNav.querySelectorAll('a').forEach((link) => {
            link.addEventListener('click', () => {
                mainNav.classList.remove('is-open');
                menuToggle.setAttribute('aria-expanded', 'false');
            });
        });
    </script>
</body>
</html>
