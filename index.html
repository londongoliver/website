<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore photography, music, filmmaking, and acting by London Oliver.">
    <meta name="theme-color" content="#11110f">
    <title>London Oliver</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

        :root {
            color-scheme: dark;
            --paper: #11110f;
            --ink: #f3f1e9;
            --muted: #898982;
            --line: #34342e;
            --accent: #c9f36a;
        }

        * { box-sizing: border-box; }
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'DM Sans', Arial, sans-serif;
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            min-height: 100svh;
        }
        a { color: inherit; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }

        main {
            align-items: center;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(340px, .82fr);
            margin: 0 auto;
            max-width: 1680px;
            min-height: 100vh;
            min-height: 100svh;
            padding: clamp(32px, 7vw, 104px) clamp(24px, 8vw, 128px);
        }
        .identity {
            align-self: center;
            position: relative;
        }
        .identity::before {
            border: 1px solid rgba(201, 243, 106, .32);
            border-radius: 50%;
            content: '';
            height: clamp(110px, 19vw, 250px);
            position: absolute;
            right: 4%;
            top: 8%;
            transform: rotate(-24deg) scaleX(.44);
            width: clamp(110px, 19vw, 250px);
        }
        h1 {
            font-family: 'Manrope', Arial, sans-serif;
            font-size: clamp(4rem, 12.5vw, 11.5rem);
            font-weight: 800;
            letter-spacing: -.105em;
            line-height: .78;
            margin: 0;
            position: relative;
            text-transform: uppercase;
        }
        h1 span { display: block; }
        h1 span:last-child {
            color: var(--accent);
            margin-left: .22em;
            margin-top: .13em;
        }

        .portfolio-nav { align-self: center; }
        .portfolio-nav ol { list-style: none; margin: 0; padding: 0; }
        .portfolio-nav li { border-bottom: 1px solid var(--line); }
        .portfolio-nav li:first-child { border-top: 1px solid var(--line); }
        .portfolio-nav a {
            align-items: center;
            display: grid;
            gap: 24px;
            grid-template-columns: minmax(0, 1fr) auto;
            min-height: clamp(76px, 9vw, 112px);
            text-decoration: none;
        }
        .link-title {
            font-family: 'Manrope', Arial, sans-serif;
            font-size: clamp(1.35rem, 3vw, 2.65rem);
            font-weight: 600;
            letter-spacing: -.055em;
            transition: color .25s ease, transform .3s cubic-bezier(.2, .7, .2, 1);
        }
        .link-icon {
            color: var(--muted);
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.5;
            transition: color .25s ease, transform .6s cubic-bezier(.2, .7, .2, 1);
            width: 24px;
        }
        .portfolio-nav a:hover .link-icon,
        .portfolio-nav a:focus-visible .link-icon { color: var(--accent); }
        .portfolio-nav a:hover .link-title,
        .portfolio-nav a:focus-visible .link-title { color: var(--accent); transform: translateX(8px); }
        .portfolio-nav a:hover .link-icon,
        .portfolio-nav a:focus-visible .link-icon { transform: rotate(360deg); }

        @media (min-width: 1500px) {
            .portfolio-nav a { min-height: 116px; }
        }
        @media (max-width: 960px) {
            main {
                align-content: center;
                gap: clamp(52px, 12vh, 110px);
                grid-template-columns: minmax(0, 1fr);
                padding: clamp(44px, 11vw, 84px) clamp(24px, 8vw, 56px);
            }
            .identity::before {
                height: clamp(110px, 28vw, 190px);
                right: 7%;
                top: -12%;
                width: clamp(110px, 28vw, 190px);
            }
            h1 { font-size: clamp(4.6rem, 19vw, 8.5rem); }
            .portfolio-nav a { min-height: 76px; }
            .link-title { font-size: clamp(1.5rem, 6vw, 2.1rem); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <header class="identity">
            <h1><span>London</span><span>Oliver</span></h1>
        </header>
        <nav class="portfolio-nav" aria-label="Explore the portfolio">
            <ol>
                <li>
                    <a href="/photography">
                        <span class="link-title">Photography</span>
                        <svg class="link-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/></svg>
                    </a>
                </li>
                <li>
                    <a href="/music">
                        <span class="link-title">Music</span>
                        <svg class="link-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/></svg>
                    </a>
                </li>
                <li>
                    <a href="/filmmaking">
                        <span class="link-title">Filmmaking</span>
                        <svg class="link-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/></svg>
                    </a>
                </li>
                <li>
                    <a href="/acting">
                        <span class="link-title">Acting</span>
                        <svg class="link-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 19 19 5M8 5h11v11"/></svg>
                    </a>
                </li>
            </ol>
        </nav>
    </main>
</body>
</html>
